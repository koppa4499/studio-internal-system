<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio System</title>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @font-face {
            font-family: 'FT Aktual';
            src: url('https://fonts.gstatic.com/s/courierPrime/v13/u-4n0qyriQwlOrhSvowK_l5OcU0.woff2') format('woff2');
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'FT Aktual', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: white; color: black; }
        input[type="checkbox"] { accent-color: black; cursor: pointer; }
        .header { border-bottom: 1px solid black; padding: 30px; margin-bottom: 30px; }
        .header h1 { font-size: 12px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; }
        .header p { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; margin-top: 5px; }
        .container { max-width: 950px; margin: 0 auto; padding: 0 20px 40px; }
        .tabs { display: flex; border-bottom: 1px solid black; margin-bottom: 40px; flex-wrap: wrap; }
        .tab-btn { padding: 12px 20px; border: none; background: white; cursor: pointer; font-size: 11px; font-weight: bold; border-bottom: 2px solid white; font-family: 'FT Aktual', sans-serif; text-transform: uppercase; color: black; }
        .tab-btn.active { border-bottom: 2px solid black; }
        .tab-btn:hover { background: #f0f0f0; }
        .subtabs { display: flex; gap: 0; margin-bottom: 20px; border: 1px solid black; width: fit-content; }
        .subtab-btn { padding: 8px 16px; border: none; background: white; cursor: pointer; font-size: 10px; font-weight: bold; font-family: 'FT Aktual', sans-serif; text-transform: uppercase; color: black; }
        .subtab-btn.active { background: black; color: white; }
        .subtab-btn + .subtab-btn { border-left: 1px solid black; }
        .content { display: none; }
        .content.active { display: block; }
        .form-section { margin-bottom: 30px; }
        .form-section h2 { font-size: 10px; font-weight: bold; margin-bottom: 15px; padding-bottom: 8px; border-bottom: 1px solid black; text-transform: uppercase; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { border: 1px solid black; padding: 10px; text-align: left; font-size: 10px; }
        th { background: white; font-weight: bold; text-transform: uppercase; width: 25%; }
        label { display: block; font-size: 10px; font-weight: bold; margin-bottom: 5px; text-transform: uppercase; }
        input, textarea, select { padding: 8px; border: 1px solid black; background: white; color: black; font-size: 10px; font-family: 'FT Aktual', sans-serif; width: 100%; }
        button { padding: 10px 16px; border: 1px solid black; background: white; color: black; cursor: pointer; font-weight: bold; font-family: 'FT Aktual', sans-serif; text-transform: uppercase; font-size: 10px; }
        button:hover { background: #f0f0f0; }
        button.primary { background: black; color: white; }
        button.primary:hover { background: #333; }
        .buttons { display: flex; gap: 10px; margin-top: 30px; }
        .message { padding: 12px; border: 1px solid black; margin-bottom: 20px; font-size: 10px; display: none; }
        .success { color: black; }
        .error { color: red; border-color: red; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .card { border: 1px solid black; padding: 0; cursor: pointer; display: flex; flex-direction: column; overflow: hidden; }
        .card:hover { background: #f5f5f5; }
        .card img { width: 100%; height: 240px; object-fit: cover; object-position: center; }
        .card-content { flex: 1; overflow: hidden; display: flex; flex-direction: column; padding: 12px; padding-bottom: 16px; }
        .card h3 { font-size: 10px; font-weight: bold; margin-bottom: 8px; text-transform: uppercase; }
        .card p { font-size: 9px; margin-bottom: 6px; }
        .card-text { overflow: hidden; }
        .card-text p:last-child { display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; margin-bottom: 0; }
        .card button { margin: 0; padding: 8px; border: none; border-top: 1px solid black; background: white; color: black; cursor: pointer; font-weight: bold; font-family: 'FT Aktual', sans-serif; text-transform: uppercase; font-size: 10px; margin-top: auto; }
        .badges { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0; }
        .badge { border: 1px solid black; padding: 2px 6px; font-size: 8px; font-weight: bold; text-transform: uppercase; }
        .empty { padding: 40px; text-align: center; font-size: 11px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; overflow-y: auto; }
        .modal.active { display: block; }
        .modal-content { background: white; margin: 20px auto; max-width: 800px; border: 2px solid black; padding: 40px; }
        .modal-close { font-size: 20px; cursor: pointer; border: 1px solid black; padding: 0 8px; background: white; }
        .modal-close:hover { background: #f0f0f0; }
        .dims-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .comp-row { display: flex; gap: 10px; margin-bottom: 8px; }
        .comp-list { font-size: 9px; margin-top: 6px; padding-top: 6px; border-top: 1px solid #ddd; }
        .comp-list-item { display: flex; justify-content: space-between; margin-bottom: 3px; }
        .project-images { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
        .project-images img { width: 80px; height: 80px; object-fit: cover; border: 1px solid black; }
        .project-image-strip { display: flex; gap: 4px; overflow-x: auto; }
        .project-image-strip img { width: 100%; height: 240px; object-fit: cover; flex-shrink: 0; }
        .object-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
        .object-btn { padding: 10px 16px; border: 1px solid black; background: white; cursor: pointer; font-weight: bold; font-family: 'FT Aktual', sans-serif; text-transform: uppercase; font-size: 10px; }
        .object-btn.active { background: black; color: white; }
        .add-object-row { display: flex; gap: 10px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>322A</h1>
        <p>Internal System</p>
    </div>

    <div class="container">
        <div class="tabs">
            <button class="tab-btn active" id="btnForm" onclick="switchTab('form')">Add Part</button>
            <button class="tab-btn" id="btnArchive" onclick="switchTab('archive')">View Archive</button>
            <button class="tab-btn" id="btnBrowse" onclick="switchTab('browse')">Browse</button>
            <button class="tab-btn" id="btnProjects" onclick="switchTab('projects')">Projects</button>
        </div>

        <!-- FORM TAB -->
        <div id="form" class="content active">
            <div class="message success" id="successMsg">✓ Part successfully saved!</div>
            <div class="message error" id="errorMsg"></div>

            <form id="partForm" onsubmit="return savePart(event)">
                <input type="hidden" id="imageData" value="">

                <div class="form-section">
                    <h2>Part Data</h2>
                    <table>
                        <tr><th>Function *</th><td><input type="text" id="function" required></td></tr>
                        <tr><th>Part</th><td><input type="text" id="part"></td></tr>
                        <tr><th>Name *</th><td><input type="text" id="name" required></td></tr>
                        <tr>
                            <th>Dimensions (L x W x H in mm)</th>
                            <td>
                                <div class="dims-row">
                                    <input type="text" id="length" placeholder="L">
                                    <input type="text" id="width" placeholder="W">
                                    <input type="text" id="height" placeholder="H">
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <th>Image</th>
                            <td>
                                <input type="file" id="imageInput" accept="image/*" style="display: none;">
                                <button type="button" onclick="document.getElementById('imageInput').click()">Upload Image</button>
                                <div id="imagePreview" style="margin-top: 10px;"></div>
                            </td>
                        </tr>
                    </table>
                </div>

                <div class="form-section">
                    <h2>Components (optional — leave empty for a base part)</h2>
                    <div id="componentsList"></div>
                    <button type="button" onclick="addComponentRow()" style="margin-top: 10px;">+ Add Component</button>
                </div>

                <div class="form-section">
                    <h2>Description</h2>
                    <textarea id="description" style="min-height: 100px;"></textarea>
                </div>

                <div class="buttons">
                    <button type="submit" class="primary">Save Part</button>
                    <button type="reset">Clear</button>
                </div>
            </form>
        </div>

        <!-- ARCHIVE TAB -->
        <div id="archive" class="content">
            <div class="subtabs">
                <button class="subtab-btn active" id="subtabParts" onclick="switchArchiveView('parts')">Parts</button>
                <button class="subtab-btn" id="subtabAssemblies" onclick="switchArchiveView('assemblies')">Assemblies</button>
            </div>
            <div style="margin-bottom: 20px;">
                <input type="text" id="search" placeholder="Search by function, part, or name...">
            </div>
            <div id="grid" class="grid"></div>
        </div>

        <!-- Detail Modal -->
        <div id="detailModal" class="modal">
            <div class="modal-content">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 10px;">
                    <button onclick="downloadPartPDF(window.currentPart)" style="padding: 10px 20px; background: black; color: white; border: 1px solid black; font-size: 10px; cursor: pointer; font-weight: bold; font-family: 'FT Aktual', sans-serif; text-transform: uppercase;">⬇ Download PDF</button>
                    <div style="margin-left: auto; display: flex; gap: 8px;">
                        <button onclick="openEditModal(window.currentPart)" style="padding: 10px 20px; background: black; color: white; border: 1px solid black; font-size: 10px; cursor: pointer; font-weight: bold; font-family: 'FT Aktual', sans-serif; text-transform: uppercase;">✎ Edit</button>
                        <span class="modal-close" onclick="closeDetail()">&times;</span>
                    </div>
                </div>
                <div id="detailContent"></div>
            </div>
        </div>

        <!-- Edit Modal -->
        <div id="editModal" class="modal">
            <div class="modal-content" style="max-width: 500px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2 style="margin: 0; font-family: 'FT Aktual', sans-serif; font-size: 16px;">Edit Part</h2>
                    <span class="modal-close" onclick="closeEditModal()">&times;</span>
                </div>
                <form id="editForm" onsubmit="saveEditPart(event)">
                    <div style="margin-bottom: 15px;"><label>Function</label><input type="text" id="editFunction"></div>
                    <div style="margin-bottom: 15px;"><label>Part</label><input type="text" id="editPart"></div>
                    <div style="margin-bottom: 15px;"><label>Name</label><input type="text" id="editName"></div>
                    <div style="margin-bottom: 15px;">
                        <label>Dimensions (L x W x H)</label>
                        <div class="dims-row">
                            <input type="text" id="editLength" placeholder="L">
                            <input type="text" id="editWidth" placeholder="W">
                            <input type="text" id="editHeight" placeholder="H">
                        </div>
                    </div>
                    <div style="margin-bottom: 15px;"><label>Description</label><textarea id="editDescription" style="min-height: 100px;"></textarea></div>
                    <div style="display: flex; gap: 10px;">
                        <button type="submit" class="primary" style="flex: 1;">Save</button>
                        <button type="button" onclick="closeEditModal()" style="flex: 1;">Cancel</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Browse Tab -->
        <div id="browse" class="content">
            <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 40px; overflow-y: auto;">
                <div id="browseContainer" style="text-align: center; width: 100%; max-width: 600px; display: flex; flex-direction: column;">
                    <h2 id="browseName" style="font-size: 24px; font-weight: bold; margin-bottom: 8px; min-height: 32px;"></h2>
                    <p id="browseMeta" style="font-size: 12px; color: #666; margin-bottom: 20px;"></p>
                    <div id="browseImageContainer" style="width: 100%; height: 500px; background: #f5f5f5; border: 2px solid black; display: flex; align-items: center; justify-content: center; margin-bottom: 30px; overflow: hidden;">
                        <img id="browseImage" src="" style="max-width: 100%; max-height: 100%; object-fit: contain;">
                    </div>
                    <div id="browseNotes" style="background: white; border: 1px solid black; padding: 20px; margin-bottom: 30px; text-align: left; height: 120px; overflow-y: auto; font-size: 12px; line-height: 1.6;"></div>
                    <div style="display: flex; gap: 20px; justify-content: space-between;">
                        <button onclick="browsePrevious()">← Previous</button>
                        <span id="browseCounter" style="font-weight: bold; font-size: 14px;"></span>
                        <button onclick="browseNext()">Next →</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Projects Tab -->
        <div id="projects" class="content">
            <div class="form-section">
                <h2>New Project</h2>
                <table>
                    <tr><th>Name *</th><td><input type="text" id="projectName" required></td></tr>
                    <tr><th>Description</th><td><textarea id="projectDescription" style="min-height: 60px;"></textarea></td></tr>
                    <tr>
                        <th>Images</th>
                        <td>
                            <input type="file" id="projectImageInput" accept="image/*" multiple style="display: none;">
                            <button type="button" onclick="document.getElementById('projectImageInput').click()">Upload Images</button>
                            <div id="projectImagePreview" class="project-images"></div>
                        </td>
                    </tr>
                </table>
                <button onclick="createProject()" class="primary">Save Project</button>
            </div>
            <div class="form-section">
                <h2>All Projects</h2>
                <div id="projectsGrid" class="grid"></div>
            </div>
        </div>
    </div>

    <!-- Project Detail Modal (shows Objects) -->
    <div id="projectDetailModal" class="modal">
        <div class="modal-content">
            <div style="display: flex; justify-content: flex-end; align-items: center; margin-bottom: 20px; gap: 8px;">
                <button onclick="openEditProjectModal(window.currentProject)" style="padding: 10px 20px; background: black; color: white; border: 1px solid black; font-size: 10px; cursor: pointer; font-weight: bold; font-family: 'FT Aktual', sans-serif; text-transform: uppercase;">✎ Edit</button>
                <span class="modal-close" onclick="closeProjectDetail()">&times;</span>
            </div>
            <div id="projectDetailContent"></div>
        </div>
    </div>

    <!-- Project Edit Modal -->
    <div id="editProjectModal" class="modal">
        <div class="modal-content" style="max-width: 500px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="margin: 0; font-family: 'FT Aktual', sans-serif; font-size: 16px;">Edit Project</h2>
                <span class="modal-close" onclick="closeEditProjectModal()">&times;</span>
            </div>
            <form id="editProjectForm" onsubmit="saveEditProject(event)">
                <div style="margin-bottom: 15px;"><label>Name</label><input type="text" id="editProjectName"></div>
                <div style="margin-bottom: 15px;"><label>Description</label><textarea id="editProjectDescription" style="min-height: 100px;"></textarea></div>
                <div style="display: flex; gap: 10px;">
                    <button type="submit" class="primary" style="flex: 1;">Save</button>
                    <button type="button" onclick="closeEditProjectModal()" style="flex: 1;">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        let supabaseClient = null;
        let allPartsCache = [];
        let archiveView = 'parts';
        let projectImages = [];
        let currentObjectId = null;

        window.addEventListener('load', function() {
            supabaseClient = window.supabase.createClient(
                'https://wlkqoacibkoepxpccjin.supabase.co',
                'sb_publishable_jTzU8HTvBD97YbH0NlWBDQ_VqYJ34pI'
            );
            console.log('Supabase initialized');
        });

        async function uploadImageToStorage(file) {
            const fileName = Date.now() + '_' + Math.floor(Math.random() * 10000) + '_' + file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
            const { error } = await supabaseClient.storage.from('studio-images').upload(fileName, file);
            if (error) throw error;
            const { data: urlData } = supabaseClient.storage.from('studio-images').getPublicUrl(fileName);
            return urlData.publicUrl;
        }

        function switchTab(tab) {
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            if (tab === 'form') document.getElementById('btnForm').classList.add('active');
            if (tab === 'archive') { document.getElementById('btnArchive').classList.add('active'); loadArchive(); }
            if (tab === 'browse') { document.getElementById('btnBrowse').classList.add('active'); loadBrowse(); }
            if (tab === 'projects') { document.getElementById('btnProjects').classList.add('active'); loadProjects(); }
        }

        function switchArchiveView(view) {
            archiveView = view;
            document.getElementById('subtabParts').classList.toggle('active', view === 'parts');
            document.getElementById('subtabAssemblies').classList.toggle('active', view === 'assemblies');
            loadArchive();
        }

        document.getElementById('imageInput').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;
            document.getElementById('imagePreview').innerHTML = 'Uploading...';
            try {
                const url = await uploadImageToStorage(file);
                document.getElementById('imagePreview').innerHTML = `<img src="${url}" style="max-width: 200px; max-height: 150px; border: 1px solid black; margin-top: 10px;">`;
                document.getElementById('imageData').value = url;
            } catch (err) {
                alert('Upload error: ' + err.message);
                document.getElementById('imagePreview').innerHTML = '';
            }
        });

        document.getElementById('projectImageInput').addEventListener('change', async function(e) {
            const files = Array.from(e.target.files);
            document.getElementById('projectImagePreview').innerHTML = 'Uploading...';
            try {
                for (const file of files) {
                    const url = await uploadImageToStorage(file);
                    projectImages.push(url);
                }
                renderProjectImagePreview();
            } catch (err) {
                alert('Upload error: ' + err.message);
                renderProjectImagePreview();
            }
        });

        function renderProjectImagePreview() {
            document.getElementById('projectImagePreview').innerHTML = projectImages.map((img, i) =>
                `<div style="position: relative;"><img src="${img}"><button type="button" onclick="removeProjectImage(${i})" style="position: absolute; top: -8px; right: -8px; padding: 2px 6px; font-size: 8px;">x</button></div>`
            ).join('');
        }

        function removeProjectImage(i) {
            projectImages.splice(i, 1);
            renderProjectImagePreview();
        }

        async function loadAllPartsCache() {
            const { data } = await supabaseClient.from('parts').select('id, name, part').order('name');
            allPartsCache = data || [];
        }

        async function getAssembliesCache() {
            const { data: comps } = await supabaseClient.from('part_components').select('assembly_id');
            const assemblyIds = [...new Set((comps || []).map(c => c.assembly_id))];
            if (!allPartsCache.length) await loadAllPartsCache();
            return allPartsCache.filter(p => assemblyIds.includes(p.id));
        }

        async function addComponentRow() {
            if (!allPartsCache.length) await loadAllPartsCache();
            const rowId = 'comp_' + Date.now() + Math.floor(Math.random() * 1000);
            const options = allPartsCache.map(p => `<option value="${p.id}">${p.name}${p.part ? ' — Part ' + p.part : ''}</option>`).join('');
            const div = document.createElement('div');
            div.id = rowId;
            div.className = 'comp-row';
            div.innerHTML = `
                <select style="flex: 2;"><option value="">Select part...</option>${options}</select>
                <input type="number" placeholder="Qty" value="1" min="1" style="flex: 1;">
                <button type="button" onclick="document.getElementById('${rowId}').remove()">Remove</button>
            `;
            document.getElementById('componentsList').appendChild(div);
        }

        function getComponentsFromForm() {
            return Array.from(document.getElementById('componentsList').children).map(row => {
                const select = row.querySelector('select');
                const qty = row.querySelector('input');
                return { component_id: select.value, quantity: parseInt(qty.value) || 1 };
            }).filter(c => c.component_id);
        }

        async function saveComponents(assemblyId, components) {
            if (!components.length) return;
            const rows = components.map(c => ({ assembly_id: assemblyId, component_id: c.component_id, quantity: c.quantity }));
            const { error } = await supabaseClient.from('part_components').insert(rows);
            if (error) {
                alert('Components could not be saved: ' + error.message);
            }
        }

        function savePart(event) {
            event.preventDefault();
            const part = {
                function: document.getElementById('function').value,
                part: document.getElementById('part').value,
                name: document.getElementById('name').value,
                description: document.getElementById('description').value,
                length: document.getElementById('length').value,
                width: document.getElementById('width').value,
                height: document.getElementById('height').value,
                image: document.getElementById('imageData').value
            };

            supabaseClient.from('parts').insert([part]).select().then(async function(result) {
                if (result.error) throw result.error;

                const components = getComponentsFromForm();
                if (components.length && result.data && result.data[0]) {
                    await saveComponents(result.data[0].id, components);
                }

                document.getElementById('errorMsg').style.display = 'none';
                document.getElementById('successMsg').style.display = 'block';
                document.getElementById('partForm').reset();
                document.getElementById('imagePreview').innerHTML = '';
                document.getElementById('componentsList').innerHTML = '';
                allPartsCache = [];
                setTimeout(() => { document.getElementById('successMsg').style.display = 'none'; }, 5000);
            }).catch(function(err) {
                document.getElementById('successMsg').style.display = 'none';
                document.getElementById('errorMsg').textContent = '✗ Error: ' + err.message;
                document.getElementById('errorMsg').style.display = 'block';
            });
            return false;
        }

        async function loadArchive() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '<div class="empty">Loading...</div>';
            if (!supabaseClient) { setTimeout(loadArchive, 500); return; }

            try {
                const { data: parts, error } = await supabaseClient.from('parts').select('*').order('id', { ascending: false });
                if (error) throw error;

                const { data: allComps } = await supabaseClient.from('part_components').select('assembly_id, component_id, quantity');
                const compsByAssembly = {};
                (allComps || []).forEach(c => {
                    if (!compsByAssembly[c.assembly_id]) compsByAssembly[c.assembly_id] = [];
                    compsByAssembly[c.assembly_id].push(c);
                });

                const partsById = {};
                (parts || []).forEach(p => { partsById[p.id] = p; });

                const search = document.getElementById('search').value.toLowerCase();
                let filtered = (parts || []).filter(p => {
                    const isAssembly = !!compsByAssembly[p.id];
                    return archiveView === 'assemblies' ? isAssembly : !isAssembly;
                });

                filtered = filtered.filter(p => {
                    return !search ||
                        (p.function && p.function.toLowerCase().includes(search)) ||
                        (p.part && p.part.toLowerCase().includes(search)) ||
                        (p.name && p.name.toLowerCase().includes(search));
                });

                if (filtered.length === 0) {
                    grid.innerHTML = `<div class="empty">No ${archiveView} found</div>`;
                    return;
                }

                grid.innerHTML = filtered.map(p => {
                    const comps = compsByAssembly[p.id] || [];
                    const compsHtml = comps.length ? `
                        <div class="comp-list">
                            ${comps.map(c => {
                                const cp = partsById[c.component_id];
                                return `<div class="comp-list-item"><span>${cp ? cp.name : 'Unknown'}${cp && cp.part ? ' (' + cp.part + ')' : ''}</span><span>x${c.quantity}</span></div>`;
                            }).join('')}
                        </div>
                    ` : '';
                    return `
                        <div class="card" onclick="showDetail(${JSON.stringify(p).replace(/"/g, '&quot;')})">
                            ${p.image ? `<img src="${p.image}">` : ''}
                            <div class="card-content">
                                <h3>${p.name}</h3>
                                <div class="card-text">
                                    <p><strong>Function:</strong> ${p.function || ''}</p>
                                    <p><strong>Part:</strong> ${p.part || '-'}</p>
                                    ${(p.length || p.width || p.height) ? `<p><strong>Dim:</strong> ${p.length || '-'} x ${p.width || '-'} x ${p.height || '-'} mm</p>` : ''}
                                    ${p.description ? `<p style="font-size: 9px; margin-top: 8px;">${p.description}</p>` : ''}
                                    ${compsHtml}
                                </div>
                            </div>
                            <button onclick="event.stopPropagation(); deletePart(${p.id})">Delete</button>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                grid.innerHTML = '<div class="empty">Error: ' + err.message + '</div>';
            }
        }

        function deletePart(id) {
            if (confirm('Delete this part?')) {
                supabaseClient.from('parts').delete().eq('id', id).then(() => loadArchive()).catch(err => alert('Error: ' + err.message));
            }
        }

        async function showDetail(part) {
            window.currentPart = part;

            let componentsHtml = '';
            const { data: comps } = await supabaseClient.from('part_components').select('quantity, component_id').eq('assembly_id', part.id);
            if (comps && comps.length) {
                const { data: compParts } = await supabaseClient.from('parts').select('id, name').in('id', comps.map(c => c.component_id));
                componentsHtml = `
                    <div style="font-size: 9px; font-weight: bold; margin-bottom: 5px;">COMPONENTS</div>
                    <table style="width: 100%; border-collapse: collapse; margin-bottom: 10px;">
                        ${comps.map(c => {
                            const cp = (compParts || []).find(p => p.id === c.component_id);
                            return `<tr><td style="border: 1px solid black; padding: 6px;">${cp ? cp.name : 'Unknown'}</td><td style="border: 1px solid black; padding: 6px; width: 60px;">x${c.quantity}</td></tr>`;
                        }).join('')}
                    </table>
                `;
            }

            const html = `
                <div style="padding: 0; margin: 0; background: white; font-family: 'FT Aktual', sans-serif; font-size: 9px; width: 100%;">
                    <div style="padding: 4px;">
                        <div style="text-align: center; font-size: 9px; font-weight: bold; margin-bottom: 10px;">STUDIO — INTERNAL SYSTEM</div>
                        <div style="margin-bottom: 10px;">
                            <div style="font-size: 9px; font-weight: bold;">NAME</div>
                            <div style="border-bottom: 1px solid black; padding: 4px 0; font-size: 13px; font-weight: bold;">${part.name || ''}</div>
                        </div>
                        <table style="width: 100%; border-collapse: collapse; margin-bottom: 10px;">
                            <tr><td style="border: 1px solid black; padding: 6px; font-weight: bold; width: 25%;">FUNCTION</td><td style="border: 1px solid black; padding: 6px;">${part.function || ''}</td></tr>
                            <tr><td style="border: 1px solid black; padding: 6px; font-weight: bold;">PART</td><td style="border: 1px solid black; padding: 6px;">${part.part || '-'}</td></tr>
                            ${(part.length || part.width || part.height) ? `<tr><td style="border: 1px solid black; padding: 6px; font-weight: bold;">DIMENSIONS (L x W x H)</td><td style="border: 1px solid black; padding: 6px;">${part.length || '-'} x ${part.width || '-'} x ${part.height || '-'} mm</td></tr>` : ''}
                        </table>
                        ${part.image ? `<div style="border: 1px solid black; margin-bottom: 10px; height: 300px; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #f5f5f5;"><img src="${part.image}" style="max-width: 100%; max-height: 300px; object-fit: cover;"></div>` : ''}
                        ${componentsHtml}
                        <div style="font-size: 9px; font-weight: bold; margin-bottom: 4px;">DESCRIPTION</div>
                        <div style="border: 1px solid black; padding: 6px; min-height: 100px; line-height: 1.4;">${part.description || ''}</div>
                    </div>
                </div>
            `;
            document.getElementById('detailContent').innerHTML = html;
            document.getElementById('detailModal').classList.add('active');
        }

        function downloadPartPDF(part) {
            const element = document.getElementById('detailContent');
            const filename = (part.name || 'part') + '.pdf';
            const opt = {
                margin: [8, 8, 8, 8],
                filename: filename,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true, allowTaint: true, backgroundColor: '#ffffff' },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save().catch(err => console.error('PDF generation error:', err));
        }

        function closeDetail() { document.getElementById('detailModal').classList.remove('active'); }
        document.getElementById('detailModal').addEventListener('click', function(e) { if (e.target === this) closeDetail(); });
        document.getElementById('search').addEventListener('keyup', loadArchive);

        function openEditModal(part) {
            window.currentEditPart = part;
            document.getElementById('editFunction').value = part.function || '';
            document.getElementById('editPart').value = part.part || '';
            document.getElementById('editName').value = part.name || '';
            document.getElementById('editLength').value = part.length || '';
            document.getElementById('editWidth').value = part.width || '';
            document.getElementById('editHeight').value = part.height || '';
            document.getElementById('editDescription').value = part.description || '';
            document.getElementById('editModal').classList.add('active');
        }
        function closeEditModal() { document.getElementById('editModal').classList.remove('active'); }

        async function saveEditPart(event) {
            event.preventDefault();
            if (!window.currentEditPart) return;
            const updatedData = {
                function: document.getElementById('editFunction').value,
                part: document.getElementById('editPart').value,
                name: document.getElementById('editName').value,
                length: document.getElementById('editLength').value,
                width: document.getElementById('editWidth').value,
                height: document.getElementById('editHeight').value,
                description: document.getElementById('editDescription').value
            };
            try {
                const { data, error } = await supabaseClient.from('parts').update(updatedData).eq('id', window.currentEditPart.id).select();
                if (error) { alert('Error: ' + error.message); return; }
                window.currentPart = data[0];
                showDetail(window.currentPart);
                closeEditModal();
                loadArchive();
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        let browseIndex = 0;
        let browseAllParts = [];

        async function loadBrowse() {
            try {
                const { data, error } = await supabaseClient.from('parts').select('*').order('created_at', { ascending: false });
                if (error) throw error;
                browseAllParts = data || [];
                browseIndex = 0;
                if (browseAllParts.length === 0) {
                    document.getElementById('browseContainer').innerHTML = '<p>No parts</p>';
                    return;
                }
                displayBrowsePart();
                setupBrowseSwipe();
            } catch (err) {
                console.error('Error:', err);
            }
        }

        function setupBrowseSwipe() {
            const c = document.getElementById('browseImageContainer');
            let tx = 0;
            c.addEventListener('touchstart', (e) => { tx = e.touches[0].clientX; });
            c.addEventListener('touchend', (e) => {
                if (tx - e.changedTouches[0].clientX > 50) browseNext();
                else if (e.changedTouches[0].clientX - tx > 50) browsePrevious();
            });
        }

        function displayBrowsePart() {
            if (!browseAllParts.length) return;
            const p = browseAllParts[browseIndex];
            document.getElementById('browseName').textContent = p.name || '';
            document.getElementById('browseMeta').textContent = `${p.function || '-'} · Part ${p.part || '-'}`;
            document.getElementById('browseImage').src = p.image || '';
            document.getElementById('browseNotes').textContent = p.description || 'No description';
            document.getElementById('browseCounter').textContent = `${browseIndex + 1} / ${browseAllParts.length}`;
        }

        function browseNext() { browseIndex = (browseIndex + 1) % browseAllParts.length; displayBrowsePart(); }
        function browsePrevious() { browseIndex = (browseIndex - 1 + browseAllParts.length) % browseAllParts.length; displayBrowsePart(); }

        async function createProject() {
            const name = document.getElementById('projectName').value;
            if (!name) { alert('Name required'); return; }
            const description = document.getElementById('projectDescription').value;

            const { error } = await supabaseClient.from('projects').insert([{ name, description, images: projectImages }]);
            if (error) { alert('Error: ' + error.message); return; }

            document.getElementById('projectName').value = '';
            document.getElementById('projectDescription').value = '';
            projectImages = [];
            renderProjectImagePreview();
            loadProjects();
        }

        async function loadProjects() {
            const grid = document.getElementById('projectsGrid');
            grid.innerHTML = '<div class="empty">Loading...</div>';
            const { data, error } = await supabaseClient.from('projects').select('*').order('id', { ascending: false });
            if (error) { grid.innerHTML = '<div class="empty">Error: ' + error.message + '</div>'; return; }
            if (!data.length) { grid.innerHTML = '<div class="empty">No projects yet</div>'; return; }

            const { data: allObjects } = await supabaseClient.from('project_objects').select('project_id, name');
            const objectsByProject = {};
            (allObjects || []).forEach(o => {
                if (!objectsByProject[o.project_id]) objectsByProject[o.project_id] = [];
                objectsByProject[o.project_id].push(o.name);
            });

            grid.innerHTML = data.map(p => {
                const images = p.images || [];
                const objectNames = objectsByProject[p.id] || [];
                const imageStrip = images.length ? `<div class="project-image-strip">${images.map(img => `<img src="${img}">`).join('')}</div>` : '';
                const objectsHtml = objectNames.length ? `<div class="comp-list"><div class="comp-list-item"><span>${objectNames.join(', ')}</span></div></div>` : '';
                return `
                    <div class="card" onclick='showProjectDetail(${JSON.stringify(p).replace(/'/g, "&#39;")})'>
                        ${imageStrip}
                        <div class="card-content">
                            <h3>${p.name}</h3>
                            <p>${p.description || ''}</p>
                            ${objectsHtml}
                        </div>
                        <button onclick="event.stopPropagation(); deleteProject(${p.id})">Delete</button>
                    </div>
                `;
            }).join('');
        }

        async function showProjectDetail(project) {
            window.currentProject = project;
            currentObjectId = null;
            const images = project.images || [];

            const html = `
                <div style="text-align: center; font-size: 9px; font-weight: bold; margin-bottom: 10px;">STUDIO — PROJECT</div>
                <div style="margin-bottom: 10px;">
                    <div style="font-size: 9px; font-weight: bold;">NAME</div>
                    <div style="border-bottom: 1px solid black; padding: 4px 0; font-size: 13px; font-weight: bold;">${project.name || ''}</div>
                </div>
                ${images.length ? `<div class="project-image-strip" style="margin-bottom: 10px;">${images.map(img => `<img src="${img}" style="height: 200px; border: 1px solid black;">`).join('')}</div>` : ''}
                <div style="font-size: 9px; font-weight: bold; margin: 10px 0 4px;">DESCRIPTION</div>
                <div style="border: 1px solid black; padding: 6px; min-height: 60px; line-height: 1.4; margin-bottom: 20px;">${project.description || ''}</div>

                <div class="form-section">
                    <h2>Objects in this project</h2>
                    <div class="add-object-row">
                        <input type="text" id="newObjectName" placeholder="e.g. Table, Chair">
                        <button type="button" onclick="addProjectObject()">+ Add Object</button>
                    </div>
                    <div id="objectTabs" class="object-tabs"></div>
                    <div id="objectDetailArea"></div>
                </div>
            `;
            document.getElementById('projectDetailContent').innerHTML = html;
            document.getElementById('projectDetailModal').classList.add('active');
            await loadProjectObjects();
        }

        async function loadProjectObjects() {
            const { data: objects } = await supabaseClient.from('project_objects').select('*').eq('project_id', window.currentProject.id).order('id');
            window.currentProjectObjects = objects || [];

            const tabsDiv = document.getElementById('objectTabs');
            if (!window.currentProjectObjects.length) {
                tabsDiv.innerHTML = '<span style="font-size: 10px; color: #888;">No objects yet — add one above.</span>';
                document.getElementById('objectDetailArea').innerHTML = '';
                return;
            }

            tabsDiv.innerHTML = window.currentProjectObjects.map(o => `
                <button class="object-btn ${o.id === currentObjectId ? 'active' : ''}" onclick="selectObject(${o.id})">${o.name}</button>
                <button type="button" onclick="deleteProjectObject(${o.id})" style="border-color: red; color: red;">x</button>
            `).join('');

            if (currentObjectId === null && window.currentProjectObjects.length) {
                selectObject(window.currentProjectObjects[0].id);
            } else if (currentObjectId !== null) {
                selectObject(currentObjectId);
            }
        }

        async function addProjectObject() {
            const name = document.getElementById('newObjectName').value;
            if (!name) { alert('Name required'); return; }
            const { data, error } = await supabaseClient.from('project_objects').insert([{ project_id: window.currentProject.id, name }]).select();
            if (error) { alert('Error: ' + error.message); return; }
            document.getElementById('newObjectName').value = '';
            currentObjectId = data[0].id;
            await loadProjectObjects();
            loadProjects();
        }

        function deleteProjectObject(id) {
            if (!confirm('Delete this object and its parts list?')) return;
            supabaseClient.from('project_objects').delete().eq('id', id).then(() => {
                if (currentObjectId === id) currentObjectId = null;
                loadProjectObjects();
                loadProjects();
            }).catch(err => alert('Error: ' + err.message));
        }

        async function selectObject(objectId) {
            currentObjectId = objectId;
            document.querySelectorAll('.object-btn').forEach(b => b.classList.remove('active'));
            const objects = window.currentProjectObjects || [];
            const obj = objects.find(o => o.id === objectId);
            document.querySelectorAll('.object-btn').forEach(b => {
                if (b.textContent === (obj ? obj.name : '')) b.classList.add('active');
            });

            const area = document.getElementById('objectDetailArea');
            area.innerHTML = `
                <div style="margin-bottom: 20px;">
                    <h2>Parts in ${obj ? obj.name : ''}</h2>
                    <div id="objPartsList"></div>
                    <button type="button" onclick="addObjectPartRow()" style="margin-top: 10px;">+ Add Part</button>
                </div>
                <div style="margin-bottom: 20px;">
                    <h2>Assemblies in ${obj ? obj.name : ''}</h2>
                    <div id="objAssembliesList"></div>
                    <button type="button" onclick="addObjectAssemblyRow()" style="margin-top: 10px;">+ Add Assembly</button>
                </div>
                <button onclick="saveObjectParts()" class="primary">Save</button>
                <div id="objCurrentParts" style="margin-top: 20px;"></div>
            `;
            await renderObjectCurrentParts();
        }

        async function renderObjectCurrentParts() {
            const { data: objParts } = await supabaseClient.from('project_parts').select('id, part_id, quantity').eq('object_id', currentObjectId);
            const div = document.getElementById('objCurrentParts');
            if (!objParts || !objParts.length) { div.innerHTML = '<div class="empty">No parts added yet</div>'; return; }

            const { data: parts } = await supabaseClient.from('parts').select('id, name').in('id', objParts.map(op => op.part_id));
            div.innerHTML = `
                <div style="font-size: 10px; font-weight: bold; margin-bottom: 8px; text-transform: uppercase;">Currently added</div>
                <table>
                    ${objParts.map(op => {
                        const part = (parts || []).find(p => p.id === op.part_id);
                        return `<tr><td>${part ? part.name : 'Unknown'}</td><td style="width: 60px;">x${op.quantity}</td><td style="width: 80px;"><button type="button" onclick="removeObjectPart(${op.id})">Remove</button></td></tr>`;
                    }).join('')}
                </table>
            `;
        }

        function removeObjectPart(id) {
            supabaseClient.from('project_parts').delete().eq('id', id).then(() => renderObjectCurrentParts());
        }

        async function addObjectPartRow() {
            if (!allPartsCache.length) await loadAllPartsCache();
            const { data: comps } = await supabaseClient.from('part_components').select('assembly_id');
            const assemblyIds = new Set((comps || []).map(c => c.assembly_id));
            const basicParts = allPartsCache.filter(p => !assemblyIds.has(p.id));

            const rowId = 'obj_part_' + Date.now() + Math.floor(Math.random() * 1000);
            const options = basicParts.map(p => `<option value="${p.id}">${p.name}${p.part ? ' — Part ' + p.part : ''}</option>`).join('');
            const div = document.createElement('div');
            div.id = rowId;
            div.className = 'comp-row';
            div.innerHTML = `
                <select style="flex: 2;"><option value="">Select part...</option>${options}</select>
                <input type="number" placeholder="Qty" value="1" min="1" style="flex: 1;">
                <button type="button" onclick="document.getElementById('${rowId}').remove()">Remove</button>
            `;
            document.getElementById('objPartsList').appendChild(div);
        }

        async function addObjectAssemblyRow() {
            const assemblies = await getAssembliesCache();
            const rowId = 'obj_asm_' + Date.now() + Math.floor(Math.random() * 1000);
            const options = assemblies.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
            const div = document.createElement('div');
            div.id = rowId;
            div.className = 'comp-row';
            div.innerHTML = `
                <select style="flex: 2;"><option value="">Select assembly...</option>${options}</select>
                <input type="number" placeholder="Qty" value="1" min="1" style="flex: 1;">
                <button type="button" onclick="document.getElementById('${rowId}').remove()">Remove</button>
            `;
            document.getElementById('objAssembliesList').appendChild(div);
        }

        async function saveObjectParts() {
            const fromList = (listId) => Array.from(document.getElementById(listId).children).map(row => {
                const select = row.querySelector('select');
                const qty = row.querySelector('input');
                return { part_id: select.value, quantity: parseInt(qty.value) || 1 };
            }).filter(c => c.part_id);

            const items = [...fromList('objPartsList'), ...fromList('objAssembliesList')];
            if (!items.length) { alert('Add at least one part or assembly first'); return; }

            const rows = items.map(i => ({ object_id: currentObjectId, part_id: i.part_id, quantity: i.quantity }));
            const { error } = await supabaseClient.from('project_parts').insert(rows);
            if (error) { alert('Error: ' + error.message); return; }

            document.getElementById('objPartsList').innerHTML = '';
            document.getElementById('objAssembliesList').innerHTML = '';
            renderObjectCurrentParts();
        }

        function closeProjectDetail() { document.getElementById('projectDetailModal').classList.remove('active'); }
        document.getElementById('projectDetailModal').addEventListener('click', function(e) { if (e.target === this) closeProjectDetail(); });

        function deleteProject(id) {
            if (confirm('Delete this project?')) {
                supabaseClient.from('projects').delete().eq('id', id).then(() => {
                    closeProjectDetail();
                    loadProjects();
                }).catch(err => alert('Error: ' + err.message));
            }
        }

        function openEditProjectModal(project) {
            window.currentEditProject = project;
            document.getElementById('editProjectName').value = project.name || '';
            document.getElementById('editProjectDescription').value = project.description || '';
            document.getElementById('editProjectModal').classList.add('active');
        }
        function closeEditProjectModal() { document.getElementById('editProjectModal').classList.remove('active'); }

        async function saveEditProject(event) {
            event.preventDefault();
            if (!window.currentEditProject) return;
            const updatedData = {
                name: document.getElementById('editProjectName').value,
                description: document.getElementById('editProjectDescription').value
            };
            try {
                const { data, error } = await supabaseClient.from('projects').update(updatedData).eq('id', window.currentEditProject.id).select();
                if (error) { alert('Error: ' + error.message); return; }
                window.currentProject = data[0];
                closeEditProjectModal();
                showProjectDetail(window.currentProject);
                loadProjects();
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }
    </script>
</body>
</html>
